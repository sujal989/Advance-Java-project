<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EliteWear</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="account-page">
    <div class="account-card">

        <div class="form-tabs">
            <button type="button" class="tab-btn active">Login</button>
        </div>

        <div class="form-content active">
            <h2>Login</h2>

            <form id="loginForm" autocomplete="off">

                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username"
                        required>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required>

                <button
                        type="submit"
                        class="btn"
                        id="loginButton">
                    Login
                </button>

            </form>

            <p
                    class="error-msg"
                    id="loginError"
                    style="display:none;">
            </p>

            <p style="margin-top:10px;">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

            <p style="margin-top:10px;">
                <a href="home.html">← Back to Home</a>
            </p>

        </div>

    </div>
</div>


<script>

    // =========================
    // CHECK EXISTING SESSION
    // =========================

    async function checkExistingSession() {

        try {

            const response =
                await fetch("/api/auth/session");


            // No active session
            if (!response.ok) {

                localStorage.removeItem(
                    "loggedUser"
                );

                return;
            }


            const session =
                await response.json();


            if (!session.loggedIn) {

                localStorage.removeItem(
                    "loggedUser"
                );

                return;
            }


            // Active admin session
            if (session.role === "admin") {

                window.location.href =
                    "adminpanel.html";

            }

            // Active normal user session
            else {

                window.location.href =
                    "home.html";
            }


        } catch (error) {

            console.error(
                "Session check failed:",
                error
            );
        }
    }


    checkExistingSession();


    // =========================
    // LOGIN FORM
    // =========================

    const loginForm =
        document.getElementById(
            "loginForm"
        );

    const errorEl =
        document.getElementById(
            "loginError"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );


    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const username =
                document
                    .getElementById(
                        "username"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            errorEl.style.display =
                "none";

            errorEl.textContent =
                "";


            // Basic frontend validation
            if (
                username === "" ||
                password === ""
            ) {

                errorEl.textContent =
                    "Please enter both username and password.";

                errorEl.style.display =
                    "block";

                return;
            }


            // Prepare form data
            const params =
                new URLSearchParams();


            params.append(
                "username",
                username
            );


            params.append(
                "password",
                password
            );


            loginButton.disabled =
                true;

            loginButton.textContent =
                "Logging in...";


            try {

                // Backend login
                const response =
                    await fetch(
                        "/api/auth/login",
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body:
                            params
                        }
                    );


                const data =
                    await response.json();


                // Login failed
                if (!response.ok) {

                    errorEl.textContent =
                        data.message ||
                        "Invalid username or password.";

                    errorEl.style.display =
                        "block";

                    return;
                }


                // Login successful
                if (data.success) {

                    /*
                     * We keep this only for basic
                     * frontend display/navigation.
                     *
                     * Real authentication is now
                     * handled by the backend session.
                     */
                    localStorage.setItem(
                        "loggedUser",
                        JSON.stringify(data)
                    );


                    // Admin
                    if (data.role === "admin") {

                        window.location.href =
                            "adminpanel.html";

                    }

                    // Normal user
                    else {

                        window.location.href =
                            "home.html";
                    }


                } else {

                    errorEl.textContent =
                        data.message ||
                        "Invalid username or password.";

                    errorEl.style.display =
                        "block";
                }


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                errorEl.textContent =
                    "Could not reach the server. Please make sure the backend is running.";

                errorEl.style.display =
                    "block";


            } finally {

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";
            }
        }
    );

</script>

</body>
</html>
